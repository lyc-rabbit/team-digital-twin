# 组织影响力图谱 (OIG) — 本地 Neo4j
#
# 启动:
#   docker compose up -d
#
# 停止:
#   docker compose down
#
# 浏览器:
#   http://localhost:7474
#   用户 neo4j / 密码 teamtwin123
#
# 后端 .env 对应:
#   NEO4J_URI=bolt://127.0.0.1:7687
#   NEO4J_USER=neo4j
#   NEO4J_PASSWORD=teamtwin123
#
# 改密码: 设置环境变量 NEO4J_PASSWORD 后重新 up。
# 注意: 不要向容器注入 NEO4J_PASSWORD，官方镜像会把它当成 neo4j.conf 配置项。
# 首次启动约需 20–40 秒，健康检查通过后再重启后端并「重建图谱」。

services:
  neo4j:
    image: neo4j:5.26.0-community
    container_name: team-twin-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"   # HTTP Browser
      - "7687:7687"   # Bolt
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-teamtwin123}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 128m
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "cypher-shell -u neo4j -p '${NEO4J_PASSWORD:-teamtwin123}' 'RETURN 1' || exit 1",
        ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 25s

volumes:
  neo4j_data:
  neo4j_logs:
